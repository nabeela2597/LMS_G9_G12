<!DOCTYPE html>
<html>
<head>
    <title>Birthday Countdown Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            padding: 30px;
        }

        .container {
            background: white;
            width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #ff4081;
        }

        input, button {
            padding: 10px;
            margin: 10px;
            width: 80%;
        }

        button {
            background-color: #ff4081;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #review {
            margin-top: 15px;
            color: darkblue;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🎂 Birthday Countdown Checker 🎂</h1>

    <p>Select your birthday:</p>

    <input type="date" id="birthday">

    <br>

    <button onclick="checkBirthday()">
        Check Countdown
    </button>

    <div id="result"></div>
    <div id="review"></div>
</div>

<script>

function checkBirthday() {

    let birthInput = document.getElementById("birthday").value;

    if (birthInput === "") {
        document.getElementById("result").innerHTML =
        "⚠ Please select your birthday!";
        return;
    }

    let today = new Date();

    let birthday = new Date(birthInput);

    let nextBirthday = new Date(
        today.getFullYear(),
        birthday.getMonth(),
        birthday.getDate()
    );

    if (nextBirthday < today) {
        nextBirthday.setFullYear(today.getFullYear() + 1);
    }

    let diffTime = nextBirthday - today;

    let daysLeft = Math.ceil(
        diffTime / (1000 * 60 * 60 * 24)
    );

    let message = "";

    if (daysLeft === 0) {
        message = "🎉 Happy Birthday! Have a wonderful day!";
    }
    else if (daysLeft <= 30) {
        message = "🥳 Your birthday is coming soon!";
    }
    else {
        message = "🎈 Start planning for your special day!";
    }

    document.getElementById("result").innerHTML =
    "Days Left: " + daysLeft + "<br>" + message;

    // Loop and String Building
    let countdownReview = "";

    for (let i = 1; i <= 5; i++) {
        countdownReview += "🎂 Countdown Step " + i + "<br>";
    }

    document.getElementById("review").innerHTML =
    countdownReview;
}

</script>

</body>
</html>
