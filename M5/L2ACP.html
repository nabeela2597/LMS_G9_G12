<!DOCTYPE html>
<html>
<head>
    <title>My Superhero Power Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
        }

        #heroContainer {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .hero-card {
            width: 220px;
            padding: 15px;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
        }

        .hero-card h2 {
            color: #e74c3c;
        }

        .hero-card p {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>🦸 My Superhero Power Cards 🦸</h1>

    <div id="heroContainer"></div>

    <script>

        // Creating a Superhero Class
        class Superhero {

            // Constructor
            constructor(name, power, city) {
                this.name = name;
                this.power = power;
                this.city = city;
            }

            // Method to display hero card
            displayCard() {

                return `
                    <div class="hero-card">
                        <h2>${this.name}</h2>
                        <p><strong>Power:</strong> ${this.power}</p>
                        <p><strong>City:</strong> ${this.city}</p>
                    </div>
                `;
            }
        }

        // Creating superhero objects
        let hero1 = new Superhero(
            "Thunder Girl",
            "Lightning Control",
            "Metro City"
        );

        let hero2 = new Superhero(
            "Captain Speed",
            "Super Speed",
            "Flash Town"
        );

        let hero3 = new Superhero(
            "Shadow Ninja",
            "Invisibility",
            "Dark Valley"
        );

        // Displaying cards
        let container = document.getElementById("heroContainer");

        container.innerHTML =
            hero1.displayCard() +
            hero2.displayCard() +
            hero3.displayCard();

    </script>

</body>
</html>
