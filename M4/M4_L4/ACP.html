<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Function to find the sum of arguments
function addNumbers(num1, num2, num3) {
    return num1 + num2 + num3;
}

// Calling the function
let sum = addNumbers(10, 20, 30);
console.log("Sum of the numbers:", sum);

// Trigonometric values
let degree = 30;

// Convert degree to radians
let radian = degree * (Math.PI / 180);

console.log("Trigonometric Values for", degree, "degrees:");
console.log("Sin =", Math.sin(radian));
console.log("Cos =", Math.cos(radian));
console.log("Tan =", Math.tan(radian));
    </script>
</body>
</html>
